; Root pytest config for ~/.claude.
;
; Without this, `pytest` run from the home dir walks the whole tree and dies:
; state/worktrees/ holds git worktrees belonging to OTHER repos (scopely), and
; collecting their test suites produced 405 collection errors against 1384
; collected tests. backups/ holds frozen policy snapshots with the same problem.
; Scoping testpaths to tests/ makes the obvious invocation work; tests/pytest.ini
; still governs a run started from inside tests/.
[pytest]
testpaths = tests
norecursedirs = state backups .git node_modules
markers =
    unit: fast isolated tests (<100ms each)
    integration: tests against real projects (<30s total)
    regression: tests for known bugs
addopts = -q --tb=short
