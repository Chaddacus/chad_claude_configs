# Pre-registered hypotheses for stage-aware orchestrator loop (plan-final §7)
#
# THIS FILE IS BINDING.
#
# Once committed and Slice 1a starts, these hypotheses and thresholds
# cannot be re-litigated. If a kill threshold hits, the affected slice
# rolls back. If a hypothesis turns out to be wrong, you don't get to
# change it — you get to record the falsification and add a NEW
# hypothesis with new pre-registration.
#
# The point of pre-registration is to defeat sunk-cost bias. The whole
# experiment depends on this constraint holding. Do not edit this file
# after Slice 1a starts except to add new hypotheses for future slices.
#
# Reference: ~/.codex-spar/stage-aware-orchestrator-loop/plan-final.md §7
# Consumed by: ~/.claude/bench/analyze.py hypothesis-check (Slice V)
# Amendment protocol: APPEND new hypotheses ONLY. Existing ones are frozen.
# Lives under policy/ (versioned) not bench/ (gitignored ephemeral data).
# Pre-registration is only binding once committed.

schema_version: 1
registry_id: stage-aware-orchestrator-loop-v1
frozen_at: 2026-05-20  # commit date; do not edit after
plan_ref: ~/.codex-spar/stage-aware-orchestrator-loop/plan-final.md
plan_sha_at_freeze: null  # populate via `git rev-parse HEAD:plan-final.md` at commit time

# Pinned environment — kill thresholds are only valid against this baseline.
# Re-baseline + new registry if any of these change materially.
pinned_environment:
  claude_model_family: "claude-sonnet-4.5-or-later"  # update at next major model bump
  auto_runtime_common_sha: 6c944ac512d1b2352b192bd3d3fab1cde5124f3c  # git -C ~/.claude rev-parse HEAD:bin/auto_runtime_common.py at freeze
  corpus_path: ~/.claude/bench/fixtures/
  baseline_path: ~/.claude/bench/baselines/<auto_runtime_common_sha>/
  runs_per_fixture: 3
  evaluation_window_default_weeks: 4

hypotheses:

  - id: H-alpha
    title: Registry questions cause real decision changes on non-trivial work
    statement: >
      Externalized phase-keyed questions cause the loop to record decision_record
      events where changed=true AND the downstream next_action differs from what
      the would-have-been baseline produced — on R3 tasks, with non-trivial frequency.
    blocked_by_slice: 1b  # ship gate fires after Slice 1b
    metric:
      name: median_changed_actionable_decisions_per_R3_task
      definition: >
        Per R3 fixture, count decision_record events where (a) changed == true AND
        (b) the resulting next_action diff vs baseline event log is non-empty.
        Report median across the 3 R3 fixtures × 3 runs/fixture = 9 runs.
      computed_by: analyze.py hypothesis-check --hypothesis H-alpha
    pass_threshold: ">= 2 per task (median)"
    kill_threshold: "< 1 per task (median) across 10 R3 runs post-Slice-1b"
    falsification_condition: >
      Loop asks registry questions but answers never change downstream actions.
      Suggests either: registry questions are not load-bearing for actual decisions,
      OR decision_record canonical-state-hash logic is too coarse to detect change.
    on_kill: >
      Roll back Slice 1b. Re-examine: are the registry's targets_decision_kind
      mappings actually wired to real decisions, or are they labels on
      decisions the loop wasn't making anyway?

  - id: H-beta
    title: Verifier matrix does not slow trivial work
    statement: >
      Adding the route×phase verifier matrix does not regress R2 wall-clock
      latency unacceptably. R2 work should remain effectively as fast as baseline.
    blocked_by_slice: 3
    metric:
      name: R2_wall_clock_p95_regression_pct
      definition: >
        For each R2 fixture, compute p95 wall_clock_ms over 3 runs post-Slice-3
        divided by p95 wall_clock_ms over 3 baseline runs, minus 1, × 100.
        Report max across the 4 R2 fixtures.
      computed_by: analyze.py hypothesis-check --hypothesis H-beta
    pass_threshold: "<= 15% regression on max R2 fixture"
    kill_threshold: "> 25% regression on any R2 fixture"
    falsification_condition: >
      Verifier matrix is too aggressive for R2 — likely the per-cell verifier_budget_ms
      values are too generous, OR baseline capture overhead is leaking into the
      transition budget despite being specified as pre-dispatch.
    on_kill: >
      Roll back Slice 3 OR tighten R2 verifier_budget_ms values + re-test.
      If still fails: R2 may need to bypass verifier matrix entirely
      (same posture as R1).

  - id: H-gamma
    title: Verifier matrix catches more introduced regressions
    statement: >
      With pre-dispatch baseline capture (Slice 1c) + required/advisory matrix
      (Slice 3), the loop catches a higher rate of introduced regressions on
      a buggy-PR replay set than the current finalize-gate alone.
    blocked_by_slice: 3
    metric:
      name: introduced_failure_detection_rate_pp_delta
      definition: >
        On a fixed buggy-PR replay set (collected from real past failures, frozen
        at Slice 0; minimum 10 buggy PRs), measure introduced_failure detection
        rate (true positives / total introduced bugs). Compare new loop rate vs
        baseline rate. Report percentage-point delta.
      computed_by: analyze.py hypothesis-check --hypothesis H-gamma
    pass_threshold: "+10pp over baseline"
    kill_threshold: "no improvement after 10 real R3 runs post-Slice-3"
    falsification_condition: >
      Verifier matrix doesn't actually detect more regressions than the
      existing finalize-gate. Possible causes: pre-dispatch baseline keying
      collapses too often into unknown_failure; matrix required/advisory split
      is wrong; per-phase verifiers chosen are not the load-bearing ones.
    on_kill: >
      Roll back Slice 3 OR re-design the matrix cell allocation based on
      which verifier statuses actually fired on the buggy-PR replay set.

  - id: H-delta
    title: No covert regression on simple work
    statement: >
      Adding phase machinery to R1+R2 (where machinery is supposed to bypass
      or run minimally) does not silently degrade acceptance rate on
      simple work.
    blocked_by_slice: 3
    metric:
      name: R1_R2_acceptance_rate_delta_pp
      definition: >
        Acceptance rate on R1 + R2 fixtures (6 total) post-Slice-3
        minus baseline acceptance rate on the same fixtures.
        Acceptance defined per fixture's expected_acceptance_signature field.
      computed_by: analyze.py hypothesis-check --hypothesis H-delta
    pass_threshold: "within +/- 5pp of baseline"
    kill_threshold: "> 5pp drop"
    falsification_condition: >
      Bypass logic is broken — new machinery is firing on R1/R2 when it
      shouldn't, breaking the fast path.
    on_kill: >
      Roll back whichever slice introduced the regression. Likely Slice 1b
      (question injection not respecting skip_when) or Slice 3 (verifier
      matrix firing on R2 in unintended cells).

  - id: H-epsilon
    title: Instrumentation actually instruments (anti-Goodhart guard)
    statement: >
      The new event stream (cycle_summary, decision_record, verifier events,
      phase_changed) actually predicts real failures, not just produces metrics.
      For real-world failures, the event log should retroactively show a
      warning sign at non-trivial frequency.
    blocked_by_slice: 3  # measured continuously post-Slice-3
    metric:
      name: postmortem_warning_sign_ratio
      definition: >
        Of the first 10 real-task failures (where Chad explicitly marks a
        track as failed or rolls back the agent's work), what fraction had
        a retroactively-identifiable warning sign in the event log?
        Warning sign = any one of:
          - decision_record with rapid churn (>3 changes on same kind in 5 cycles)
          - unknown_failure verifier event before failure
          - phase oscillation (same edge twice in a row, even if cap not hit)
          - baseline_unavailable event in the lead-up
          - dispatch_blocked with route_promotion_backfill_required for >3 cycles
      computed_by: analyze.py postmortem --failure-tracks <ids>
    pass_threshold: ">= 50%"
    kill_threshold: "< 30%"
    falsification_condition: >
      Instrumentation is producing metrics decoupled from real outcomes.
      Classic Goodhart: the loop optimizes the recorded signals while real
      failure modes go undetected. Either the warning signs are wrong, OR
      the events are recording the wrong things, OR there are no events
      at the points where real failures originate.
    on_kill: >
      DO NOT roll back any slice. Instead: pause expanding the architecture.
      Run a deep postmortem on the 10 failures, identify what events SHOULD
      have existed at the failure-origination points, and propose a new
      instrumentation slice with its own pre-registered H-epsilon-v2.
      Until that lands, treat the architecture as feature-frozen.

# --- amendment log (append only after registry is frozen) ---
amendments: []
